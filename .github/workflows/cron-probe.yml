name: cron probe (temporary)

# TEMPORARY DIAGNOSTIC, 2026-09-08. Delete once it has answered its question.
#
# Two repositories created today — snuggery-apps and snuggery-apps-template,
# one private and one public — have had zero schedule-triggered runs in six
# hours, while workflow_dispatch and push both work, every documented cause is
# eliminated, and GitHub reports no incident. This repository is nine days old,
# which makes it the control: if a schedule fires HERE but not THERE, the
# variable is repository age, and the answer is to wait. If it does not fire
# here either, the problem is account-wide and belongs with GitHub Support.
#
# It does nothing but print the time. It cannot affect Pages, which builds from
# the branch through GitHub's own dynamic workflow, not from this directory.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "cron probe fired at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
